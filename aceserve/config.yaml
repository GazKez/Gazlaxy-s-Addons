name: "Gazlaxy AceServe"
version: "0.1.4"
slug: "gazlaxy_aceserve"

description: "AceStream Engine with HTTPAceProxy for Home Assistant"

url: "https://github.com/GazKez/Gazlaxy-s-Addons"

arch:
  - amd64

startup: services
boot: auto
init: false

# Home Assistant Ingress exposes the statistics dashboard inside the
# authenticated Home Assistant frontend. Port 8099 is internal-only and is
# served by the restricted nginx proxy configured in ingress.conf.
ingress: true
ingress_port: 8099
ingress_entry: /stat
ingress_stream: true
panel_title: "AceServe"
panel_icon: "mdi:play-network"
panel_admin: true

ports:
  6878/tcp: 6878
  8621/tcp: 8621
  62062/tcp: 62062
  8888/tcp: 8888

ports_description:
  6878/tcp: "AceStream HTTP"
  8621/tcp: "AceStream P2P"
  62062/tcp: "AceStream API"
  8888/tcp: "HTTPAceProxy"

options:
  max_connections: 10
  max_concurrent_channels: 5
  dns_servers:
    - "1.1.1.1"
    - "1.0.0.1"

schema:
  max_connections: int(1,100)
  max_concurrent_channels: int(1,50)
  dns_servers:
    - str

map:
  - addon_config:rw

image: "ghcr.io/gazkez/{arch}-addon-gazlaxy-aceserve"
